<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PvPHQ Ranked Verlauf</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#1B2430;--muted:#5B6B7A;--line:#DDE2E7;--accent:#DD7E46;--up:#23875A;--down:#C2453A;--chip:#E6EAEE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A21;--surface:#1C242D;--ink:#EEF1F4;--muted:#9AA8B5;--line:#2C3743;--up:#4CC38A;--down:#F0786B;--chip:#26313C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A21;--surface:#1C242D;--ink:#EEF1F4;--muted:#9AA8B5;--line:#2C3743;--up:#4CC38A;--down:#F0786B;--chip:#26313C;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1560px;margin:0 auto;padding:26px 24px 48px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}
h1{font:800 28px/1.1 "Manrope",system-ui,sans-serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0;font-size:14px}
h2{font:800 19px/1.2 "Manrope",system-ui,sans-serif;margin:0 0 2px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px "IBM Plex Sans",system-ui,sans-serif;background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;transition:background .15s,opacity .15s}
.chip.on{background:var(--accent);color:#1B1410}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip.mode{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px}
.chip.mode.off{opacity:.55}
.chip.mode:hover{opacity:1}
.ic{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;flex:none}
.ic img{width:22px;height:22px;object-fit:contain}
.ic svg{width:20px;height:20px}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
@media (max-width:1060px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;min-width:0;box-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 28px rgba(20,30,40,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:0 10px 28px rgba(0,0,0,.35)}}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.name{color:var(--muted);font-size:14px;margin-top:18px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:2px}
.val{font:800 clamp(38px,4.6vw,58px)/1 "Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.delta{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.when{color:var(--muted);font-size:13px;min-height:20px;margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 8px}
.tile{background:var(--chip);border-radius:12px;padding:11px 14px}
.tile .k{color:var(--muted);font-size:12px}
.tile .n{font:800 20px/1.25 "Manrope",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tile .n.up{color:var(--up)}.tile .n.down{color:var(--down)}
.tile .s{color:var(--muted);font-size:12px}
.plot{position:relative;margin-top:8px}
.chart{touch-action:pan-y;user-select:none;-webkit-user-select:none}
svg{display:block;width:100%;height:auto}
.g{stroke:var(--line);stroke-width:1}
.z{stroke:var(--muted);stroke-dasharray:4 4}
.t{fill:var(--muted);font:11px "IBM Plex Sans",system-ui,sans-serif}
.el{font:600 11.5px "IBM Plex Sans",system-ui,sans-serif}
.ln{fill:none;stroke-linejoin:round;stroke-linecap:round}
.cx{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.dot{fill:var(--surface);stroke-width:2.5}
.tip{position:absolute;top:10px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:0 10px 28px rgba(0,0,0,.2);font-size:13px;min-width:190px;z-index:2}
.tip .th{color:var(--muted);font-size:12px;margin-bottom:4px}
.tr{display:flex;align-items:center;gap:8px;line-height:1.75}
.tr .sw{width:9px;height:9px;border-radius:50%;flex:none}
.tr .nm{flex:1}
.tr .v{font-variant-numeric:tabular-nums;font-weight:500}
.bars{margin-top:12px}
.note{color:var(--muted);font-size:13px;margin:10px 0 4px}
.empty{color:var(--muted);font-size:14px;padding:56px 4px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--muted);font-weight:500;font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.up{color:var(--up)}td.down{color:var(--down)}
.mn{display:flex;align-items:center;gap:8px}
.mn .sw{width:9px;height:9px;border-radius:50%;flex:none}
.topr{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:flex-end}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabbtn{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 20px;font:800 17px "Manrope",system-ui,sans-serif;letter-spacing:-.01em;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.tabbtn:hover{color:var(--ink)}
.tabbtn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbtn:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;border-radius:6px}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 0 14px}
.lbl{color:var(--muted);font-size:13px}
.rnav{display:inline-flex;align-items:center;gap:6px;margin-left:8px}
.rnav .chip{padding:5px 13px;font-size:16px}
.rnav .chip:disabled{opacity:.35;cursor:default}
.navl{min-width:150px;text-align:center;font-weight:500;font-size:14px}
.chrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.champ{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;padding:10px 14px;margin:14px 0 14px;font-size:15px}
.champ b{font:800 20px "Manrope",system-ui,sans-serif}
.champ .sub2{color:var(--muted);font-size:13px}
.fit{overflow-x:auto;overflow-y:hidden}
.sk{image-rendering:pixelated;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.fb{display:inline-grid;place-items:center;background:var(--chip);color:var(--muted);font-size:10px;font-style:normal}
.cv{position:relative;width:1080px;height:750px;transform-origin:0 0}
.cv svg{position:absolute;inset:0;width:1080px;height:750px}
.cv path{fill:none;stroke:var(--muted);stroke-opacity:.5;stroke-width:1.5;stroke-linejoin:round}
.cv path.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2.6}
.cl{position:absolute;width:156px;text-align:center;font:600 11px "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vl{position:absolute;left:12px;width:22px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font:600 12px "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.18em;color:var(--muted)}
.mc{position:absolute;width:156px;height:46px;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--chip);text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .12s,box-shadow .12s}
.mc:hover,.mc:focus-visible{transform:scale(1.06);z-index:3;box-shadow:0 0 0 2px var(--accent),0 8px 18px rgba(0,0,0,.3);outline:0}
.mc.chm{box-shadow:0 0 0 1.5px var(--accent)}
.mc.lo .pr{opacity:.9}
.pr{height:23px;display:flex;align-items:center;gap:6px;padding:0 8px 0 3px;font:500 12px "IBM Plex Sans",system-ui,sans-serif;color:var(--muted)}
.pr.w{color:var(--ink);font-weight:600;background:color-mix(in srgb,var(--accent) 24%,var(--chip));box-shadow:inset 3px 0 0 var(--accent)}
.pr .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr b{font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.dlg .x{float:right;background:none;border:0;font-size:26px;line-height:1;color:var(--muted);cursor:pointer}
.big{display:flex;align-items:center;gap:10px;margin:14px 0}
.big .p{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;min-width:0}
.big .p.r{justify-content:flex-end;text-align:right}
.big .sc{font:800 34px "Manrope",system-ui,sans-serif;color:var(--accent);padding:0 8px}
.sec{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.rowm{display:flex;gap:10px;padding:8px 12px;border-radius:10px;background:var(--chip);margin-bottom:6px;font-size:14px}
.rowm .r{color:var(--muted);font-size:12px;width:110px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--chip);padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:13px}
.tag button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.hint{color:var(--muted);font-size:13px;margin:0}
.foot{margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font:500 15px "IBM Plex Sans",system-ui,sans-serif;background:var(--accent);color:#1B1410;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
#status{font-size:13px;color:var(--muted);flex:1 1 180px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>PvPHQ</h1><p class="sub" id="subtitle">Verlauf der gerankten Spieler, stündlich</p></div>
  </div>
  <nav class="tabs" id="sections" role="tablist" aria-label="Bereich"></nav>
  <div id="secRanked">
  <div class="toolbar"><span class="lbl">Zeitraum</span><div class="chips" id="ranges"></div><div class="rnav" id="rnav"></div></div>
  <div class="cols">
    <section class="card">
      <h2>Anzahl</h2>
      <p class="hint">Wähle einen Modus.</p>
      <div class="chips" id="modesA"></div>
      <div class="name" id="cname">Overall</div>
      <div class="head"><div class="val" id="val">–</div><div class="delta" id="delta"></div></div>
      <div class="when" id="when"></div>
      <div class="stats" id="stats"></div>
      <div class="plot"><div class="chart" id="chartA"></div></div>
      <div class="bars" id="bars"></div>
    </section>
    <section class="card">
      <h2>Relativer Vergleich</h2>
      <p class="hint">Veränderung in Prozent seit Beginn des Zeitraums. Wähle beliebig viele Modi.</p>
      <div class="chips" id="modesB"></div>
      <div class="plot" style="margin-top:16px"><div class="chart" id="chartB"></div><div class="tip" id="tip" hidden></div></div>
      <div id="tbl"></div>
    </section>
  </div>
  <div class="foot">
    <button class="btn" id="refresh" type="button">Aktualisieren</button>
    <div id="status"></div>
  </div>
  </div>
  <div id="secChamps" hidden>
    <section class="card">
      <div class="chrow">
        <div><h2>PvPChamps</h2><p class="hint">Klicke auf ein Match für Details, Bans und Gamemodes.</p></div>
        <div class="chips" id="chTabs"></div>
      </div>
      <div class="champ" id="champBanner"></div>
      <div class="fit" id="bracket"></div>
    </section>
  </div>
  <div class="ov" id="ov" hidden></div>
</main>
<script>
(function(){
  var LADDERS=[
    ["overall","Overall"],["sword","Sword"],["axe","Axe"],["mace","Mace"],["spear_mace","Spear"],["uhc","UHC"],
    ["netherite_pot","NethPot"],["pot","Pot"],["smp","SMP"],["diamond_smp","DiaSMP"],["vanilla","Vanilla"],["cart","Cart"]
  ];
  var RANGES=[["day","Tag"],["week","Woche"],["all","Alles"]];
  var DATA_FROM=Date.parse("2026-11-04T16:00:00+01:00"); /* ältere Messungen werden ausgeblendet */
  var COLORS={overall:"var(--ink)",sword:"hsl(8 75% 58%)",axe:"hsl(30 85% 55%)",mace:"hsl(48 85% 50%)",spear_mace:"hsl(80 60% 50%)",uhc:"hsl(130 55% 48%)",netherite_pot:"hsl(165 60% 45%)",pot:"hsl(190 70% 50%)",smp:"hsl(215 75% 60%)",diamond_smp:"hsl(250 70% 65%)",vanilla:"hsl(280 60% 62%)",cart:"hsl(325 70% 62%)"};
  var P='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  var POT='<path d="M10 3h4M11 3v5l-4.5 8a3 3 0 0 0 2.6 4.5h5.8a3 3 0 0 0 2.6-4.5L13 8V3"/>';
  var SVG={
    overall:P+'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
    sword:P+'<path d="M5 19L19 5M15 5h4v4M8.5 12.5l3 3M5 19l-1.5 1.5"/></svg>',
    axe:P+'<path d="M6 20L15 9M13 4l7 7-4 2-5-5z"/></svg>',
    mace:P+'<circle cx="16" cy="8" r="3.5"/><path d="M13.5 10.5L4 20"/></svg>',
    spear_mace:P+'<path d="M4 20L18 6M19 5h-5l5 5z"/></svg>',
    uhc:P+'<path d="M12 8c-4-2-7 1-6 6 1 4 4 6 6 5 2 1 5-1 6-5 1-5-2-8-6-6zM12 8c0-2 1-3 3-4"/></svg>',
    netherite_pot:P+POT+'<path d="M8 15h8"/></svg>',
    pot:P+POT+'</svg>',
    smp:P+'<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>',
    diamond_smp:P+'<path d="M6 4h12l4 6-10 11L2 10zM2 10h20M9 4l-2 6 5 11 5-11-2-6"/></svg>',
    vanilla:P+'<path d="M12 3l8 4v10l-8 4-8-4V7zM12 11l8-4M12 11v10M12 11L4 7"/></svg>',
    cart:P+'<path d="M4 8h16l-2 8H6z"/><circle cx="8" cy="19" r="1.6"/><circle cx="16" cy="19" r="1.6"/></svg>'
  };
  var IMG={overall:"pvphq-logo.png",spear_mace:"modes/spear.png",diamond_smp:"modes/diasmp.png",netherite_pot:"modes/nethpot.png",vanilla:"modes/crystal.png"};
  var HURL="https://raw.githubusercontent.com/Stuermischer/pvphq-tracker/main/history.json";
  var nf=new Intl.NumberFormat("de-DE");
  var L=58,T=14,B=28;
  var TOL=30*6e4; /* Toleranz: Messungen kommen bis zu ca. 30 Min. zu spät */
  var data=[],selA="overall",onB={},range="all",off=0,loaded=false,failed="",cur={};
  LADDERS.forEach(function(l){onB[l[0]]=true});
  var $=function(id){return document.getElementById(id)};

  function two(n){return(n<10?"0":"")+n}
  function fD(t){var d=new Date(t);return two(d.getDate())+"."+two(d.getMonth()+1)+"."}
  function fT(t){var d=new Date(t);return two(d.getHours())+":"+two(d.getMinutes())}
  function fDT(t){return fD(t)+" "+fT(t)+" Uhr"}
  function nameOf(id){return LADDERS.filter(function(l){return l[0]===id})[0][1]}
  function sgn(v){return v>0?"+":v<0?"−":"±"}
  function fN(v){return sgn(v)+nf.format(Math.abs(v))}
  function fR(v){var a=Math.abs(v);return sgn(v)+nf.format(a>=100?Math.round(a):Math.round(a*10)/10)+"/Std."}
  function fPct(v,dec){return sgn(v)+Math.abs(v).toFixed(dec).replace(".",",")+" %"}
  function cls(v){return v>0?"up":v<0?"down":""}
  function ago(ms){
    var m=Math.max(0,Math.round(ms/6e4));
    if(m<60)return m+" Min.";
    var h=Math.floor(m/60);m=m%60;
    if(h<48)return h+" Std."+(m?" "+m+" Min.":"");
    return Math.floor(h/24)+" Tage";
  }
  function pc(d,base){return base?fPct(d/base*100,2):""}

  function icon(id){
    var s=document.createElement("span");s.className="ic";
    var img=new Image();img.alt="";
    img.onerror=function(){s.innerHTML=SVG[id]||SVG.overall};
    img.src="https://pvphq.com/assets/"+(IMG[id]||"modes/"+id+".png");
    s.appendChild(img);
    return s;
  }
  function chips(el,list,active,onPick){
    el.innerHTML="";
    list.forEach(function(x){
      var b=document.createElement("button");
      b.type="button";b.className="chip"+(x[0]===active?" on":"");b.textContent=x[1];
      b.addEventListener("click",function(){onPick(x[0])});
      el.appendChild(b);
    });
  }
  function modeChip(id,name,selected,style,onClick){
    var b=document.createElement("button");
    b.type="button";b.className="chip mode"+(selected?"":" off");
    b.setAttribute("aria-pressed",selected?"true":"false");
    if(selected&&style)b.setAttribute("style",style);
    b.appendChild(icon(id));
    var sp=document.createElement("span");sp.textContent=name;b.appendChild(sp);
    b.addEventListener("click",onClick);
    return b;
  }
  function ghost(el,txt,fn){
    var b=document.createElement("button");b.type="button";b.className="chip ghost";b.textContent=txt;
    b.addEventListener("click",fn);el.appendChild(b);
  }
  function buildModesA(){
    var el=$("modesA");el.innerHTML="";
    LADDERS.forEach(function(l){
      var id=l[0];
      el.appendChild(modeChip(id,l[1],id===selA,"background:var(--accent);color:#1B1410;opacity:1",function(){selA=id;render()}));
    });
  }
  function buildModesB(){
    var el=$("modesB");el.innerHTML="";
    ghost(el,"Alle",function(){LADDERS.forEach(function(l){onB[l[0]]=true});render()});
    ghost(el,"Keine",function(){onB={};render()});
    LADDERS.forEach(function(l){
      var id=l[0],c=COLORS[id];
      el.appendChild(modeChip(id,l[1],!!onB[id],"background:color-mix(in srgb,"+c+" 22%,var(--surface));box-shadow:inset 0 0 0 2px "+c+";opacity:1",function(){onB[id]=!onB[id];render()}));
    });
  }
  function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d}
  function winFor(){
    if(range==="all")return{from:0,to:Infinity};
    var d=dayStart(Date.now()),e;
    if(range==="day"){d.setDate(d.getDate()+off);e=new Date(d);e.setDate(e.getDate()+1)}
    else{d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);e=new Date(d);e.setDate(e.getDate()+7)}
    return{from:d.getTime(),to:e.getTime()}
  }
  function isoWeek(t){
    var d=new Date(t),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=u.getUTCDay()||7;
    u.setUTCDate(u.getUTCDate()+4-n);
    return Math.ceil(((u-new Date(Date.UTC(u.getUTCFullYear(),0,1)))/864e5+1)/7);
  }
  function navLabel(){
    var w=winFor();
    if(range==="day"){
      if(off===0)return"Heute";
      if(off===-1)return"Gestern";
      return["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(w.from).getDay()]+" "+fD(w.from);

  function series(id){

      var t=p.t+((p.o&&p.o[id])||0)*1000;
      if(t>=w.from&&t<w.to){var q={};q.t=t;q[id]=p[id];out.push(q)}

  function renderStats(pts,i){
    var id=selA,p=pts[i],prev=i>0?pts[i-1]:null,first=pts[0],isLast=i===pts.length-1,h="";
    if(prev){
      var d=p[id]-prev[id],hr=(p.t-prev.t)/36e5;
      h+=tile(isLast?"Seit letzter Messung":"Zur Messung davor",fN(d),pc(d,prev[id])+", "+fR(d/hr)+", nach "+ago(p.t-prev.t),cls(d));
    }else h+=tile("Seit letzter Messung","–","erste Messung");
    var ds0=new Date(p.t);ds0.setHours(0,0,0,0);
    var dayStart=ds0.getTime(),base=null;
    pts.forEach(function(q){if(!base&&q.t>=dayStart-TOL)base=q});
    var tl0=new Date();tl0.setHours(0,0,0,0);
    var dlab=dayStart===tl0.getTime()?"Heute":"Am "+fD(dayStart);
    if(base&&p!==base){var d2=p[id]-base[id];h+=tile(dlab,fN(d2),pc(d2,base[id])+", seit "+fT(base.t)+" Uhr",cls(d2))}
    else h+=tile(dlab,"–","noch keine zweite Messung an diesem Tag");

  function drawBars(pts,X,W,R){
    var el=$("bars"),id=selA;

    var ds=[],i;
    for(i=1;i<pts.length;i++)ds.push((pts[i][id]-pts[i-1][id])/((pts[i].t-pts[i-1].t)/36e5));
    var mx=Math.max.apply(null,ds.concat([1])),mn=Math.min.apply(null,ds.concat([0]));
    var H2=120,T2=10,B2=10;
    function Y2(v){return T2+(1-(v-mn)/(mx-mn))*(H2-T2-B2)}
    var g='<div class="note">Zuwachs pro Stunde, jeweils über den Abstand zwischen zwei Messungen.</div>';
    g+='<svg viewBox="0 0 '+W+' '+H2+'" role="img" aria-label="Zuwachs pro Stunde">';
    g+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(0).toFixed(1)+'" y2="'+Y2(0).toFixed(1)+'"/>';
    g+='<text class="t" x="'+(L-8)+'" y="'+(T2+4)+'" text-anchor="end">'+fR(mx)+'</text>';
    g+='<text class="t" x="'+(L-8)+'" y="'+(Y2(0)+4).toFixed(1)+'" text-anchor="end">0</text>';
    if(mn<0)g+='<text class="t" x="'+(L-8)+'" y="'+(H2-B2)+'" text-anchor="end">'+fR(mn)+'</text>';
    ds.forEach(function(d,k){
      var xa=X(pts[k].t),xb=X(pts[k+1].t),gap=Math.min(3,(xb-xa)*0.15);
      var y0=Y2(0),y1=Y2(d),top=Math.min(y0,y1),h=Math.max(1.5,Math.abs(y1-y0));
      g+='<rect class="bar" data-i="'+(k+1)+'" x="'+(xa+gap).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+Math.max(1,xb-xa-2*gap).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" style="fill:var('+(d<0?"--down":"--up")+')"/>';
    });

  function renderGraph(kind){

      var dl=$("delta");

      $("cname").textContent=nameOf(selA);
    }
    var ids=rel?LADDERS.map(function(l){return l[0]}).filter(function(id){return onB[id]}):[selA];
    if(!loaded){if(!rel)show(null);msg(box,failed?"Verlauf konnte nicht geladen werden.":"Lade …");return}
    if(!ids.length){msg(box,"Wähle oben mindestens einen Modus aus.");return}
    var S=ids.map(function(id){
      var pts=series(id);
      if(pts.length<2)return null;
      var base=pts[0][id];
      return{id:id,name:nameOf(id),pts:pts,ser:pts.map(function(p){return{t:p.t,v:p[id],y:rel?(base?(p[id]/base-1)*100:0):p[id]}})};
    }).filter(Boolean);
    if(!S.length){if(!rel)show(null);msg(box,"Noch zu wenig Daten. Es braucht mindestens zwei Messungen in diesem Zeitraum.");return}
    var single=rel?null:S[0];
    var R=rel?112:20;
    var cw=Math.round(box.clientWidth),W=cw>200?cw:340;
    var H=Math.round(Math.max(290,Math.min(430,W*0.55)));
    var t0=Infinity,t1=-Infinity,mn=Infinity,mx=-Infinity,tset={};
    S.forEach(function(s){
      t0=Math.min(t0,s.ser[0].t);t1=Math.max(t1,s.ser[s.ser.length-1].t);
      s.ser.forEach(function(q){mn=Math.min(mn,q.y);mx=Math.max(mx,q.y);tset[q.t]=1});
    });
    if(rel){mn=Math.min(mn,0);mx=Math.max(mx,0)}
    var times=Object.keys(tset).map(Number).sort(function(a,b){return a-b});
    var span=Math.max(1,t1-t0);
    if(mx-mn<(rel?0.02:1)){var e=rel?0.01:1;mn-=e;mx+=e}
    var pad=(mx-mn)*0.1;mn-=pad;mx+=pad;
    var dec=(mx-mn)<1?2:1;
    function X(t){return L+(t-t0)/span*(W-L-R)}
    function Y(v){return T+(1-(v-mn)/(mx-mn))*(H-T-B)}
    function fy(v){return rel?fPct(v,dec):nf.format(Math.round(v))}

    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Verlauf der gerankten Spieler">';
    s+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
    for(var k=0;k<5;k++){

      s+='<text class="t" x="'+(L-8)+'" y="'+(+y+4)+'" text-anchor="end">'+fy(v)+'</text>';
    }
    if(rel&&mn<0&&mx>0)s+='<line class="g z" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'"/>';
    var dayMode=span>=36*36e5;
    for(var j=0;j<5;j++){
      var tt=t0+span*j/4,anc=j===0?"start":j===4?"end":"middle";

    }
    S.forEach(function(q){
      var col=single?"var(--accent)":COLORS[q.id],d=q.ser.map(function(p,i){return(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.y).toFixed(1)}).join(" ");
      if(single)s+='<path d="'+d+' L'+X(t1).toFixed(1)+" "+base+" L"+X(q.ser[0].t).toFixed(1)+" "+base+' Z" fill="url(#'+gid+')"/>';
      s+='<path class="ln" style="stroke:'+col+';stroke-width:'+(single?2.6:2.4)+'" d="'+d+'"/>';
      if(q.ser.length<=1500){
        var rr=q.ser.length>300?1.5:q.ser.length>100?2.3:3.2;
        q.ser.forEach(function(p){s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+rr+'" style="fill:'+col+';stroke:var(--surface);stroke-width:1.5"/>'});

      var i2;

    }

  var section=location.hash==="#champs"?"champs":"ranked",chTab=2,chEx={};
  try{chEx=JSON.parse(localStorage.getItem("pvpchamps:v1"))||{}}catch(e){}
  function chSave(){try{localStorage.setItem("pvpchamps:v1",JSON.stringify(chEx))}catch(e){}}
  function chData(m){var d=chEx[m.c+"-"+m.id]||{};return{bans:(d.bans||[]).slice(),modes:(d.modes||[]).slice()}}
  function allMatches(){
    var out=[];
    Object.keys(CHAMPS).forEach(function(c){CHAMPS[c].matches.forEach(function(m){out.push(m)})});
    return out;
  }
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function skin(n,c,size){
    var u=(SKINS[c]&&SKINS[c][n])||(SKINS[2]&&SKINS[2][n])||(SKINS[1]&&SKINS[1][n]),e;
    if(u){e=new Image();e.src=u;e.alt=n;e.className="sk"}
    else{e=el("i","sk fb",n[0])}
    e.style.width=size+"px";e.style.height=size+"px";
    return e;
  }

  var CW=156,pos={};
  function bx(c){return 44+172*c}
  function setP(id,c,y){pos[id]={x:bx(c),y:y}}
  function avgY(a,b){return(pos[a].y+pos[b].y)/2}
  (function(){
    var k;
    for(k=0;k<8;k++)setP(1+k,0,44+k*56);
    [[9,1,2],[10,3,4],[11,5,6],[12,7,8]].forEach(function(a){setP(a[0],1,avgY(a[1],a[2]))});
    setP(13,2,avgY(9,10));setP(14,2,avgY(11,12));setP(15,3,avgY(13,14));
    for(k=0;k<4;k++){setP(16+k,0,540+k*56);setP(20+k,1,540+k*56)}
    setP(24,2,avgY(20,21));setP(25,2,avgY(22,23));setP(26,3,pos[24].y);setP(27,3,pos[25].y);
    setP(28,4,avgY(26,27));setP(29,5,pos[28].y);setP(30,5,avgY(15,29));
  })();
  var LINKS=[[1,9],[2,9],[3,10],[4,10],[5,11],[6,11],[7,12],[8,12],[9,13],[10,13],[11,14],[12,14],[13,15],[14,15],[16,20],[17,21],[18,22],[19,23],[20,24],[21,24],[22,25],[23,25],[24,26],[25,27],[26,28],[27,28],[28,29]];
  var LBL=[["Runde 1","Runde 2","Halbfinale","Finale"],["Runde 1","Runde 2","Runde 3","Runde 4","Runde 5","Finale"]];

  function renderBracket(){
    var c=chTab,ms=allMatches().filter(function(m){return m.c===c}),box=$("bracket");
    var gf=ms.filter(function(m){return m.br==="GF"})[0],champ=gf?winnerOf(gf):null,have={};
    ms.forEach(function(m){have[m.id]=m});
    function inv(id){var m=have[id];return!!(champ&&m&&(m.a===champ||m.b===champ))}
    box.innerHTML="";
    var cw=box.clientWidth||1080,k=Math.max(0.5,Math.min(1.45,cw/1080));
    var wrapIn=el("div");wrapIn.style.width=Math.round(1080*k)+"px";wrapIn.style.height=Math.round(750*k)+"px";
    var cv=el("div","cv");cv.style.transform="scale("+k+")";
    var p='';
    LINKS.forEach(function(l){
      if(!have[l[0]]||!have[l[1]])return;
      var f=pos[l[0]],t=pos[l[1]],mx=t.x-8;
      p+='<path class="'+(inv(l[0])&&inv(l[1])?"hl":"")+'" d="M'+(f.x+CW)+' '+f.y+'H'+mx+'V'+t.y+'H'+t.x+'"/>';
    });
    if(gf){
      var uf=pos[15],lf=pos[29],g=pos[30];
      p+='<path class="'+(inv(15)?"hl":"")+'" d="M'+(uf.x+CW)+' '+uf.y+'H'+(g.x+CW/2)+'V'+(g.y-23)+'"/>';
      p+='<path class="'+(inv(29)?"hl":"")+'" d="M'+(lf.x+CW/2)+' '+(lf.y-23)+'V'+(g.y+23)+'"/>';
    }
    cv.innerHTML='<svg viewBox="0 0 1080 750">'+p+'</svg>';
    function lab(t,x,y,extra){var d=el("div","cl",t);d.style.left=x+"px";d.style.top=y+"px";if(extra)d.setAttribute("style",d.getAttribute("style")+extra);cv.appendChild(d)}
    LBL[0].forEach(function(t,i){lab(t,bx(i),6)});
    LBL[1].forEach(function(t,i){lab(t,bx(i),495)});
    if(gf)lab("Grand Final",bx(4),pos[30].y-9,";text-align:right;padding-right:10px");
    var v1=el("div","vl","UPPER BRACKET");v1.style.top="130px";v1.style.height="220px";cv.appendChild(v1);
    var v2=el("div","vl","LOWER BRACKET");v2.style.top="510px";v2.style.height="220px";cv.appendChild(v2);
    ms.forEach(function(m){
      var q=pos[m.id],aw=m.sa>m.sb;
      var b=el("button","mc"+(m.br==="L"?" lo":"")+(inv(m.id)?" chm":""));
      b.type="button";b.style.left=q.x+"px";b.style.top=(q.y-23)+"px";
      b.setAttribute("aria-label",m.a+" "+m.sa+" zu "+m.sb+" "+m.b);
      [[m.a,m.sa,aw],[m.b,m.sb,!aw]].forEach(function(r){
        var row=el("div","pr"+(r[2]?" w":""));
        row.appendChild(skin(r[0],m.c,18));
        row.appendChild(el("span","nm",r[0]));
        row.appendChild(el("b",null,String(r[1])));
        b.appendChild(row);
      });
      b.addEventListener("click",function(){openDetail(m)});
      cv.appendChild(b);
    });
    wrapIn.appendChild(cv);box.appendChild(wrapIn);
  }
  function renderBanner(){
    var b=$("champBanner");b.innerHTML="";
    var gf=CHAMPS[chTab].matches.filter(function(m){return m.br==="GF"})[0];
    if(!gf){b.hidden=true;return}
    b.hidden=false;
    var w=winnerOf(gf),l=w===gf.a?gf.b:gf.a,ws=Math.max(gf.sa,gf.sb),ls=Math.min(gf.sa,gf.sb);
    b.appendChild(skin(w,chTab,40));
    var t=el("div");
    var line=el("div");line.appendChild(document.createTextNode("🏆 Champion: "));line.appendChild(el("b",null,w));
    t.appendChild(line);
    t.appendChild(el("div","sub2","Grand Final "+ws+":"+ls+" gegen "+l));
    b.appendChild(t);
  }
  function renderChamps(){
    chips($("chTabs"),[[1,"Champs 1"],[2,"Champs 2"]],chTab,function(id){chTab=id;renderChamps()});
    renderBanner();renderBracket();
  }

  function tiles(items){
    var g=el("div","tiles");
    items.forEach(function(it){g.appendChild(tile2(it[0],it[1]))});
    return g;
  }
  function tile2(k,v){var t=el("div","tile");t.appendChild(el("div","k",k));t.appendChild(el("div","n",String(v)));return t}
  function tagEditor(key,ph,m){
    var wrap=el("div"),list=el("div");
    wrap.appendChild(list);
    function draw(){
      list.innerHTML="";
      var items=chData(m)[key];
      if(!items.length)list.appendChild(el("div","hint","noch nichts eingetragen"));
      items.forEach(function(t,i){
        var tag=el("span","tag",t),b=el("button",null,"×");
        b.type="button";b.setAttribute("aria-label",t+" entfernen");
        b.addEventListener("click",function(){
          var d=chData(m);d[key].splice(i,1);chEx[m.c+"-"+m.id]=d;chSave();draw();
        });
        tag.appendChild(b);list.appendChild(tag);
      });
    }
    var row=el("div","addrow"),inp=document.createElement("input"),add=el("button","chip on","+");
    inp.placeholder=ph;add.type="button";add.setAttribute("aria-label","hinzufügen");
    function doAdd(){
      var t=inp.value.trim();if(!t)return;
      var d=chData(m);d[key].push(t);chEx[m.c+"-"+m.id]=d;chSave();inp.value="";draw();
    }
    add.addEventListener("click",doAdd);
    inp.addEventListener("keydown",function(e){if(e.key==="Enter")doAdd()});
    row.appendChild(inp);row.appendChild(add);wrap.appendChild(row);
    draw();
    return wrap;
  }
  function closeDetail(){var ov=$("ov");ov.hidden=true;ov.innerHTML=""}
  function openDetail(m){
    var all=allMatches(),ov=$("ov");
    function rec(n){
      return all.filter(function(x){return x.c===m.c&&(x.a===n||x.b===n)}).reduce(function(r,x){
        var f=x.a===n?x.sa:x.sb,a=x.a===n?x.sb:x.sa;
        if(f>a)r.w++;else r.l++;
        r.gw+=f;r.gl+=a;return r;
      },{w:0,l:0,gw:0,gl:0});
    }
    var ra=rec(m.a),rb=rec(m.b);
    var meet=all.filter(function(x){return(x.c!==m.c||x.id!==m.id)&&((x.a===m.a&&x.b===m.b)||(x.a===m.b&&x.b===m.a))}).sort(function(x,y){return x.t-y.t});
    ov.innerHTML="";ov.hidden=false;
    var dlg=el("div","dlg"),x=el("button","x","×");
    x.type="button";x.setAttribute("aria-label","Schließen");x.addEventListener("click",closeDetail);
    dlg.appendChild(x);
    dlg.appendChild(el("div","hint","PvPChamps "+m.c+", "+BRN[m.br]+", "+m.rd));
    var big=el("div","big"),pa=el("div","p"),pb=el("div","p r");
    pa.appendChild(skin(m.a,m.c,36));pa.appendChild(el("span",null,m.a));
    pb.appendChild(el("span",null,m.b));pb.appendChild(skin(m.b,m.c,36));
    big.appendChild(pa);big.appendChild(el("div","sc",m.sa+" : "+m.sb));big.appendChild(pb);
    dlg.appendChild(big);
    dlg.appendChild(tiles([["Sieger",winnerOf(m)],["Games",m.sa+m.sb],["Differenz",Math.abs(m.sa-m.sb)]]));
    dlg.appendChild(el("div","sec","Bilanz im Turnier"));
    dlg.appendChild(tiles([[m.a+" Matches",ra.w+"–"+ra.l],[m.a+" Games",ra.gw+":"+ra.gl],[m.b+" Matches",rb.w+"–"+rb.l],[m.b+" Games",rb.gw+":"+rb.gl]]));
    if(meet.length){
      dlg.appendChild(el("div","sec","Weitere Duelle"));
      meet.forEach(function(q){
        var r=el("div","rowm");
        r.appendChild(el("span","r","C"+q.c+", "+q.rd));
        r.appendChild(el("span",null,m.a+" "+(q.a===m.a?q.sa:q.sb)+" : "+(q.a===m.a?q.sb:q.sa)+" "+m.b));
        dlg.appendChild(r);
      });
    }
    dlg.appendChild(el("div","sec","Bans"));
    dlg.appendChild(tagEditor("bans","Ban hinzufügen",m));
    dlg.appendChild(el("div","sec","Gamemodes"));
    dlg.appendChild(tagEditor("modes","Gamemode hinzufügen",m));
    ov.appendChild(dlg);
    x.focus();
  }
  $("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeDetail()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("ov").hidden)closeDetail()});

  function renderSections(){
    var nav=$("sections");nav.innerHTML="";
    [["ranked","Ranked-Verlauf"],["champs","PvPChamps"]].forEach(function(x){
      var b=el("button","tabbtn",x[1]);
      b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",x[0]===section?"true":"false");
      b.addEventListener("click",function(){if(x[0]!==section)setSection(x[0])});
      nav.appendChild(b);
    });
    $("secRanked").hidden=section!=="ranked";
    $("secChamps").hidden=section!=="champs";
    $("subtitle").textContent=section==="ranked"?"Verlauf der gerankten Spieler, stündlich":"Brackets von PvPChamps 1 und 2";
  }
  function setSection(id){
    section=id;
    try{history.replaceState(null,"",id==="champs"?"#champs":location.pathname+location.search)}catch(e){}
    render();
  }
  window.addEventListener("hashchange",function(){
    var s=location.hash==="#champs"?"champs":"ranked";
    if(s!==section){section=s;render()}
  });

  var rt;
  window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(section==="champs")renderBracket();else{renderGraph("abs");renderGraph("rel")}},150)});
  $("refresh").addEventListener("click",load);
  render();load();
})();
</script>
</body>
</html>
