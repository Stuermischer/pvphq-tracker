name: Recover measurements
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
  actions: read
 
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python recover.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - run: |
          git config user.name "pvphq-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Recover measurements" || exit 0
          git push
 
