name: Track PvPHQ

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python track.py
      - run: |
          git config user.name "pvphq-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git commit -m "Update history" || exit 0
          git push
